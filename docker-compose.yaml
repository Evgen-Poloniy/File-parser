version: "3.9"

services:
  postgres:
    image: postgres:18-alpine
    container_name: file-parser-db
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - file-parser-net

  file-parser:
    build: .
    image: file-parser-image
    container_name: file-parser
    ports:
      - "${API_PORT}:8080"
    environment:
      CONFIG_PATH: ${CONFIG_PATH}
      API_KEY: ${API_KEY}
      API_HOST: ${API_HOST}
      API_PORT: 8080
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      SSL_MODE: ${SSL_MODE}
    volumes:
      - ./config:/app/config
      - ./input-data:/app/input-data
      - ./output-data:/app/output-data
      - ./error-data:/app/error-data
    depends_on:
      - postgres
    networks:
      - file-parser-net

networks:
  file-parser-net:
    driver: bridge

volumes:
  pgdata:
